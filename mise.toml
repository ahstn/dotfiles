# :schema https://mise.en.dev/schema/mise.json

[settings]
experimental = true
minimum_release_age = "3d"

dotfiles.root = "~/git/dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
# Listing only directories & files to inherit, ignoring others that shouldn't be tracked (e.g. `~/.aws`)
"~/.config/mise/config.toml" = { source = ".config/mise/config.toml" }
"~/.config/cron" = { source = ".config/cron" }
"~/.config/ghostty" = { source = ".config/ghostty" }
"~/.config/herdr" = { source = ".config/herdr" }
"~/.config/tmux" = { source = ".config/tmux" }
"~/.config/dcg" = { source = ".config/dcg" }
"~/.config/starship.toml" = { source = ".config/starship.toml" }

# ZSH - Separate handling for SSH & local sessions.
"~/.config/zsh" = { source = ".config/zsh" }
"~/.zshenv" = { source = ".config/zsh/.zshenv" }

# Pi & Oh-my-pi 
# Pi for everyday, small tasks. Oh-my-pi for more complex, multi-step tasks.
"~/.pi/" = { source = ".pi" }
# Fabric lives under this same link; its models.json links to ../../agent/models.json.
"~/.omp/agent/config.yml" = { source = ".omp/agent/config.yml" }
"~/.omp/agent/models.yml" = { source = ".omp/agent/models.yml" }
"~/.omp/agent/extensions/openrouter-routing.ts" = { source = ".omp/agent/extensions/openrouter-routing.ts" }
"~/.omp/agent/APPEND_SYSTEM.md" = { source = ".omp/agent/APPEND_SYSTEM.md" }

# Skills - NB: Some harnesses don't resolve symlinks.
"~/.agents/skills" = { source = "skills", mode = "copy" }
"~/.claude/skills" = { source = "skills", mode = "symlink-each" }

# Standalone files - sourced in ~/.config/ for organization, but symlinked to home
"~/.bash_profile" = { source = ".config/.bash_profile" }
"~/.inputrc" = { source = ".config/.inputrc" }

# Avoid clashing with repo level Git config
"~/.gitconfig" = { source = "./.config/git/.gitconfig", mode = "symlink" }
"~/.gitignore" = { source = "./.config/git/.gitignore", mode = "symlink" }

# Ephemeral LAN-only sshd. Rendered (not linked) so the dir can also hold the host key & pid.
# Inputs: SSHD_LISTEN, SSHD_USER, SSHD_ALLOW_FROM - see the template header.
"~/.config/sshd/sshd_config" = { source = ".config/sshd/sshd_config.tera", mode = "template", permissions = "0600" }

[tasks.bootstrap]
description = "Install user crontab"
run = "crontab ~/.config/cron/ahstn.crontab"

[tasks.sshd]
description = "Run a ephemeral foreground sshd from ~/.config/sshd"
usage = 'flag "-m --minutes <minutes>" default="180" help="Stop sshd automatically after this many minutes"'
run = '''
set -eu
dir="$HOME/.config/sshd"
[ -f "$dir/ssh_host_ed25519_key" ] || ssh-keygen -q -t ed25519 -N '' -C "temp-sshd@$(hostname -s)" -f "$dir/ssh_host_ed25519_key"
if [ ! -s "$dir/authorized_keys" ]; then
  echo "sshd: add the client's public key(s) to $dir/authorized_keys (chmod 600) first" >&2
  exit 1
fi
/usr/sbin/sshd -t -f "$dir/sshd_config"

/usr/sbin/sshd -D -e \
  -f "$dir/sshd_config" &
sshd_pid=$!
( sleep $(( {{ usage.minutes | int }} * 60 )) && echo "sshd: time window elapsed, stopping" >&2 && kill "$sshd_pid" ) &
timer_pid=$!
trap 'pkill -P "$timer_pid" 2>/dev/null || true; kill "$sshd_pid" "$timer_pid" 2>/dev/null || true' EXIT INT TERM
wait "$sshd_pid" || [ $? -eq 143 ]  # 143 = stopped by the timer
'''
