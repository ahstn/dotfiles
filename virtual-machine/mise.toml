# :schema https://mise.en.dev/schema/mise.json
# Host side of the VM setup: `mise run tart:<task>` or `mise run vmpal:<task>` from this folder (or
# `mise -C virtual-machine run ...` from the repo root). The tasks are in mise-tasks/, their bash in lib/.
# Personal settings go in mise.local.toml (git-ignored); see mise.local.toml.example.
# 2026.10.17 stops trusting the compromised eMudhra intermediates in mise's own downloads.
min_version = { hard = "2026.10.17" }

# Tart is installed for the tart:* tasks only, so VMPal users do not download it.
[task_templates.tart]
tools = { tart = "2.41.1" }

# Colima, Lima and the docker CLI for the builder:* tasks (lib/builder.sh).
[task_templates.builder]
tools = { colima = "0.10.3", lima = "2.2.1", docker-cli = "29.9.1" }

[tasks.lint]
description = "shellcheck the VM tasks, their libs and the guest scripts"
tools = { shellcheck = "0.11.0" }
run = "shellcheck -x lib/*.sh mise-tasks/*/* guest/*.sh */guest/*.sh"

[tasks.test]
description = "Test VM onboarding lifecycle and setup safety without changing a VM"
run = "python3 -B -m unittest discover -s tests -v"
