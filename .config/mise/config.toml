[settings]
auto_update = true
auto_update_check_duration = "4d"
experimental = true
color_theme = "catppuccin"
idiomatic_version_file_enable_tools = ["python", "node"]
minimum_release_age = "3d"
trusted_config_paths = [
  '~/git/',
  '~/.codex/worktrees/',
  '~/.herdr/worktrees/',
  '~/.bb/worktrees/',
  '~/.luvus/worktrees/',
]

[tools]
# languages and tooling
python = "3.14"
rust = "latest"
ruff = "latest"
bun = "latest"
node = "26"
uv = "latest"
terraform = "latest"
pitchfork = "latest"
gcloud = "latest"
github-cli = "latest"
kubie = "latest"
git-lfs = { version = "latest", postinstall = "git-lfs install" }

# llm and ai
codex = "latest"
pi = { version = "latest", postinstall = "pi update --extensions" }
oh-my-pi = { version = "latest", rename_exe = "omp" }

# containers
colima = "latest"
docker-cli = "latest"
lima = "latest"

# general cli
ripgrep = "latest"
starship = "latest"
eza = "0.23.5"
fd = "latest"
bat = "latest"
difftastic = "latest"

# fuzzy finders and navigation
zoxide = "latest"
fzf = "latest"
"github:wfxr/forgit" = "latest"

# misc & unsorted
"github:Dicklesworthstone/destructive_command_guard" = "latest"
vale = "latest"
1password = "latest"

[hooks]
enter = "mise i -q"

[tasks.git-lfs-setup]
description = "Configure Git LFS for this user"
run = "git lfs install --skip-repo"

[tasks.gh-auth]
run = "gh auth status || gh auth login"

[shell_alias]
ll = "eza -la --icons --group-directories-first"
docker-prune = 'docker system prune --all --volumes --force'
update-pi = "mise use -g --minimum-release-age 2h pi@latest && pi update --extensions"
update-omp = "mise use -g --minimum-release-age 2h oh-my-pi@latest"
pi-fabric = 'env PI_CODING_AGENT_DIR="$HOME/.pi/profiles/fabric" PI_FABRIC_AGENT_DIR="$HOME/.pi/profiles/fabric" PI_CODING_AGENT_SESSION_DIR="$HOME/.pi/profiles/fabric/sessions" pi'

[bootstrap.repos]
"~/git/dotfiles" = { url = "git@github.com:ahstn/dotfiles.git", ref = "main" }

[bootstrap.packages]
# macOS
"brew:coreutils" = { version = "latest", os = "macos" }
"brew:curl" = { version = "latest", os = "macos" }
"brew:weave" = { version = "latest", os = "macos" }
"brew:zsh" = { version = "latest", os = "macos" }
"brew-cask:muesli" = "latest"
"brew-cask:vorssaint" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

# VMs only: env = ["vm"] in the host's ~/.config/mise/miserc.toml (written by the virtual-machine/ guest scripts)
"brew:tailscale" = { version = "latest", os = "macos", env = "vm" }

# linux servers
"apt:curl" = "latest"
"apt:cron" = "latest"
"apt:neovim" = "latest"
"apt:git" = "latest"
"apt:gcc" = "latest"
"apt:fzf" = "latest"
"apt:libfuse-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:zsh" = "latest"
"apt:rsync" = "latest"
"apt:ripgrep" = "latest"
"apt:fd-find" = "latest"
"apt:btop" = "latest"

[bootstrap.user]
login_shell = "/bin/zsh"

# MacOS specific configuration
[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 48

[bootstrap.macos.finder]
show_pathbar = true
show_all_files = true

[bootstrap.macos.defaults]
"com.apple.finder" = { AppleShowAllFiles = true }
# Hide widgets on the desktop and in Stage Manager.
"com.apple.WindowManager" = { StandardHideWidgets = true, StageManagerHideWidgets = true }

[bootstrap.hooks.post-defaults]
run = [
  "killall Dock || true; killall WindowManager || true",
  # Helium as the default browser (http, https, .html) on macOS, when installed. macOS asks to confirm the change.
  '''[ "$(uname)" = Darwin ] || exit 0
osascript -l JavaScript -e '
ObjC.import("AppKit"); ObjC.import("CoreServices");
const id = "net.imput.helium", ws = $.NSWorkspace.sharedWorkspace;
const app = ws.URLForApplicationWithBundleIdentifier(id);
const cur = ws.URLForApplicationToOpenURL($.NSURL.URLWithString("https://example.com"));
if (app.isNil()) "Helium is not installed: default browser unchanged";
else if (!cur.isNil() && cur.path.js === app.path.js) "Helium is already the default browser";
else {
  for (const s of ["http", "https"]) $.LSSetDefaultHandlerForURLScheme($(s), $(id));
  $.LSSetDefaultRoleHandlerForContentType($("public.html"), $.kLSRolesViewer, $(id));
  "Helium set as the default browser: confirm the macOS dialog if it asks";
}'
''',
]
