[settings]
minimum_release_age = "2d"
auto_update = true
auto_update_check_duration = "4d"
experimental = true
color_theme = "catppuccin"
idiomatic_version_file_enable_tools = ["python", "node"]
trusted_config_paths = [
  '~/git/',
  '~/.codex/worktrees/',
  '~/.herdr/worktrees/',
  '~/.claude/worktrees/',
  '~/.bb/worktrees/',
]

[tools]
# languages and tooling
python = "3.14"
rust = "latest"
ruff = "latest"
bun = "latest"
node = "26"
uv = "latest"
terraform = "latest"
pitchfork = "latest"
gcloud = { version = "latest", depends = ["python"] }
github-cli = "latest"
kubie = "latest"
git-lfs = { version = "latest", postinstall = "git-lfs install" }
# tsrs, the Rust port of TypeScript 7, is the editor TypeScript server.
# Every release is a prerelease, so "latest" resolves to a 0.0.0 placeholder and the version must be pinned.
# The postinstall links the native binary to a fixed path named tsgo, which Zed and VS Code start.
"npm:tsrs" = { version = "0.18.0-ts7.1.0-dev.20260929", postinstall = 'mkdir -p ~/.local/share/tsrs-tsdk && ln -sfn "$(find "$MISE_TOOL_INSTALL_PATH" -path "*/@tsrs/*/tsrs" -type f -print -quit)" ~/.local/share/tsrs-tsdk/tsgo' }

# llm and ai
# check for updates every 6 hours, while respecting minimum_release_age (which is overridden for omp)
codex = "latest"
pi = { version = "latest", depends = [
  "node",
], auto_update = "6h", postinstall = "pi update --extensions" }
oh-my-pi = { version = "latest", rename_exe = "omp", minimum_release_age = "6h", auto_update = "6h" }
opencode = { version = "latest", allow_builds = [
  "@opencode/cli",
], auto_update = "6h" }
"github:ahstn/oceans-llm" = "latest"

# containers
colima = "latest"
docker-cli = "latest"
lima = "latest"

# general cli
ripgrep = "latest"
starship = "latest"
eza = "0.23.5"
fd = "latest"
bat = "latest"
difftastic = "latest"
mole = "latest"

# fuzzy finders and navigation
zoxide = "latest"
fzf = "latest"
"github:wfxr/forgit" = "latest"

# misc & unsorted
"github:Dicklesworthstone/destructive_command_guard" = "latest"
vale = "latest"
1password = "latest"
fnox = "latest"
age = "latest"
neovim = "latest"
"aqua:tmux/tmux-builds" = "latest"
turbo = "latest"
ruby = "latest" # required for brew taps/casks
k3s = "latest"
helm = "latest"


[tasks.git-lfs-setup]
description = "Configure Git LFS for this user"
run = "git lfs install --skip-repo"

[tasks.gh-auth]
run = "gh auth status || gh auth login"

[shell_alias]
ll = "eza -la --icons --group-directories-first"
docker-prune = 'docker system prune --all --volumes --force'
update-pi = "mise use -g --minimum-release-age 2h pi@latest && pi update --extensions"
update-omp = "mise use -g --minimum-release-age 2h oh-my-pi@latest"
[bootstrap.repos]
"~/git/dotfiles" = { url = "git@github.com:ahstn/dotfiles.git", ref = "main" }

[bootstrap.packages]
# macOS
"brew:coreutils" = { version = "latest", os = "macos" }
"brew:curl" = { version = "latest", os = "macos" }
"brew:weave" = { version = "latest", os = "macos" }
"brew:zsh" = { version = "latest", os = "macos" }
"brew-cask:muesli" = "latest"
"brew-cask:vorssaint" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:font-geist" = "latest"

# linux servers
"apt:curl" = "latest"
"apt:cron" = "latest"
"apt:neovim" = "latest"
"apt:git" = "latest"
"apt:gcc" = "latest"
"apt:fzf" = "latest"
"apt:libfuse-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:zsh" = "latest"
"apt:rsync" = "latest"
"apt:ripgrep" = "latest"
"apt:fd-find" = "latest"
"apt:btop" = "latest"

[bootstrap.brew]
adopt = true

[bootstrap.user]
login_shell = "/bin/zsh"

# MacOS specific configuration
[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 48

[bootstrap.macos.finder]
show_pathbar = true
show_all_files = true

[bootstrap.macos.defaults]
"com.apple.finder" = { AppleShowAllFiles = true }
# Hide widgets and don't reveal the desktop when clicking the wallpaper.
"com.apple.WindowManager" = { StandardHideWidgets = true, StageManagerHideWidgets = true, EnableStandardClickToShowDesktop = false }

[bootstrap.hooks.post-defaults]
run = [
  "killall Dock || true; killall WindowManager || true",
  # Helium as the default browser (http, https, .html) on macOS, when installed. macOS asks to confirm the change.
  '''[ "$(uname)" = Darwin ] || exit 0
osascript -l JavaScript -e '
ObjC.import("AppKit"); ObjC.import("CoreServices");
const id = "net.imput.helium", ws = $.NSWorkspace.sharedWorkspace;
const app = ws.URLForApplicationWithBundleIdentifier(id);
const cur = ws.URLForApplicationToOpenURL($.NSURL.URLWithString("https://example.com"));
if (app.isNil()) "Helium is not installed: default browser unchanged";
else if (!cur.isNil() && cur.path.js === app.path.js) "Helium is already the default browser";
else {
  for (const s of ["http", "https"]) $.LSSetDefaultHandlerForURLScheme($(s), $(id));
  $.LSSetDefaultRoleHandlerForContentType($("public.html"), $.kLSRolesViewer, $(id));
  "Helium set as the default browser: confirm the macOS dialog if it asks";
}'
''',
]
