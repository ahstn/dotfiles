# :schema https://mise.en.dev/schema/mise.json
# Personal additions for VM guests: mise loads this beside config.toml only with the `vm` config environment,
# which virtual-machine/guest/mise.toml selects in every guest (~/.config/mise/miserc.toml). Host Macs never load it.
#
# Each provision's base pass (virtual-machine/guest/mise.toml) applies it too. This file can add packages, tools,
# defaults, agents and hooks, but where both set the same thing the base wins; change base values in
# virtual-machine/guest/mise.local.toml instead.

# [tools]
# example = "latest"

# `docker build` in a guest goes to the host's builder (virtual-machine: builder:start, then tart:builder or
# vmpal:builder). Without it, the docker CLI pins plain `docker build` to the current context's builder, which
# needs a Docker daemon the guest does not have. Unset it (or pass --builder) to use another builder.
[env]
BUILDX_BUILDER = "vm-builder"

# [bootstrap.packages]
# "brew-cask:example" = "latest"
