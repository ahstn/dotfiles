providers:
  oceans:
    baseUrl: https://hogwarts.tail58b1f6.ts.net
    apiKey: OCEANS_LLM_API_KEY
    api: openai-completions # fallback, or openai-responses
    discovery:
      type: proxy
    # temporary overrides until we switch to litellm style discovery
    modelOverrides:
      claude-opus-5.5:
        api: anthropic-messages
        thinking:
          mode: anthropic-adaptive
          efforts: [low, medium, high, xhigh, max]
          supportsDisplay: false
      gpt-6.1-sol:
        api: openai-responses
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: medium
          requiresEffort: true

  explabs:
    baseUrl: https://api.experientiallabs.ai/v1
    apiKey: EXPLABS_API_KEY
    api: openai-completions
    discovery:
      type: openai-models-list
    modelOverrides:
      # /v1/models reports limits as context_window_tokens / maximum_output_tokens,
      # which generic discovery does not read, so set them here.
      deepseek-v4.1-flash-uncensored:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, max]
        contextWindow: 256000
        maxContextWindow: 1048576
        maxTokens: 393216
        # USD per 1M tokens, as billed by Experiential Labs (flat; no off-peak tier).
        # Input/output match DeepSeek V4.1 Flash peak list price; cache read is the gateway's rate.
        cost:
          input: 0.30
          output: 1.20
          cacheRead: 0.03
          cacheWrite: 0.30
    models:
      # Judge-only model (no chat). Served on the System One wire at {baseUrl}/v1/systemone.
      - id: jev-latest
        name: Jev (latest, Experiential Labs)
        api: typesafe
        baseUrl: https://api.experientiallabs.ai
        contextWindow: 32000

  runinfra:
    baseUrl: https://api.runinfra.ai/v1
    apiKey: "!fnox get RUN_INFRA_API_KEY" # 1Password via fnox
    api: openai-completions
    discovery:
      type: openai-models-list
    modelOverrides:
      # /v1/models reports reasoning_efforts and pricing.{input,output} / cached_input_price_usd_per_mtok,
      # which generic discovery does not read, so set them here.
      deepseek-v4-1-flash-1017:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, xhigh, max]
        contextWindow: 256000
        maxContextWindow: 1048576
        maxTokens: 393216
        # USD per 1M tokens, as listed by RunInfra /v1/models.
        cost:
          input: 0.15
          output: 0.60
          cacheRead: 0.01
          cacheWrite: 0

  openrouter:
    modelOverrides:
      anthropic/claude-fable-5.1:
        contextWindow: 256000
      openai/gpt-5.6-sol-pro:
        contextWindow: 256000
      deepseek/deepseek-v4-pro-0813:
        contextWindow: 256000
      deepseek/deepseek-v4-flash-0731:
        contextWindow: 256000
      google/gemini-3.7-flash:
        contextWindow: 256000

  github-copilot:
    modelOverrides:
      gpt-5.6-sol:
        contextWindow: 256000

  opencode-zen:
    modelOverrides:
      gpt-5.6-sol:
        contextWindow: 256000
      claude-fable-5:
        contextWindow: 256000
      deepseek-v4-pro:
        contextWindow: 256000
      gemini-3.7-flash:
        contextWindow: 256000
