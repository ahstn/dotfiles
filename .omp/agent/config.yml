providers: 
  openaiWebsockets: "on"
  openrouterVariant: default
  webSearchOrder: 
    - exa
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: unicode
theme: 
  dark: dark-catppuccin
setupVersion: 2
statusLine: 
  separator: pipe
  preset: default
  transparent: true
  compactThinkingLevel: false
power: 
  sleepPrevention: idle
lsp: 
  enabled: false
task: 
  maxRecursionDepth: 2
  isolation: 
    mode: none
    commits: ai
  maxConcurrency: 12
todo: 
  eager: default
tools: 
  {}
mcp: 
  {}
bashInterceptor: 
  enabled: true
bash: 
  autoBackground: 
    enabled: true
retry: 
  maxRetries: 2
modelRoles: 
  default: openai-codex/gpt-5.6-sol:medium
  smol: openai-codex/gpt-5.6-luna:high
  vision: openai-codex/gpt-5.6-luna:high
  advisor: anthropic/claude-fable-5:high
tier: 
  openai: auto
dev: 
  autoqaConsent: granted
composer: 
  shape: pi

# Ensure Claude Code's "superpower" skills are ignored.
# `claude plugin uninstall superpowers@claude-plugins-official`
skills:
  enableClaudeUser: false
  enableClaudeProject: false
  ignoredSkills:
    - "*superpower*"
    - "subagent-driven-development"
    - "brainstorming"
    - "writing-plans"
