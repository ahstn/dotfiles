providers:
  openaiWebsockets: "on"
  openrouterVariant: default
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
  - google-vertex
  - apple
symbolPreset: nerd
theme:
  dark: dark-catppuccin
setupVersion: 3
statusLine:
  separator: pipe
  preset: default
  transparent: true
  compactThinkingLevel: false
power:
  sleepPrevention: idle
lsp:
  enabled: true
  diagnosticsOnEdit: false
  formatOnWrite: false
task:
  maxRecursionDepth: 2
  isolation:
    commits: ai
    enabled: false
  maxConcurrency: 12
  enableEffort: true
todo:
  eager: default
tools: {}
mcp: {}
bashInterceptor:
  enabled: true
bash:
  autoBackground:
    enabled: true
retry:
  maxRetries: 2
  fallbackChains:
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - xai/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6-sol
      - xai-oauth/grok-4.5
      - web/ollama
modelRoles:
  smol: openai-codex/gpt-6.1-terra:xhigh
  vision: openai-codex/gpt-6-luna:high
  advisor: anthropic/claude-fable-5:high
  web: web/exa
  slow: openai-codex/gpt-6-astra:xhigh
  tiny: openai-codex/gpt-6.1-terra:high
  memory: openai-codex/gpt-6.1-terra:high
tier:
  openai: auto
dev:
  autoqaConsent: granted
composer:
  shape: claude
  tokenRate: true
skills:
  enableClaudeUser: false
  enableClaudeProject: false
  enableSkillCommands: false
  customDirectories:
    - ~/git/dotfiles/skills
  ignoredSkills:
    - "*superpower*"
    - subagent-driven-development
    - brainstorming
    - writing-plans
compaction:
  thresholdTokens: 256000
extendedContext: false
display:
  showTurnTime: true
  cacheMissMarker: true
plan:
  enabled: false
commands:
  enableClaudeProject: false
edit:
  mode: apply_patch
update:
  auto: false
hindsight:
  apiUrl: https://hogwarts.tail58b1f6.ts.net:8443
  bankIdPrefix: ahstn
  scoping: per-project
  autoRecall: true
  autoRetain: true
  recallTypes:
    - world
    - experience
    - observation
memory:
  backend: hindsight