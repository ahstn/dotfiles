providers:
  openaiWebsockets: "on"
  openrouterVariant: default
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
symbolPreset: unicode
theme:
  dark: dark-catppuccin
setupVersion: 2
statusLine:
  separator: pipe
  preset: default
  transparent: true
  compactThinkingLevel: false
power:
  sleepPrevention: idle
lsp:
  enabled: true
  diagnosticsOnEdit: false
  formatOnWrite: false
task:
  maxRecursionDepth: 2
  isolation:
    commits: ai
    enabled: false
  maxConcurrency: 12
todo:
  eager: default
tools:
  {}
mcp:
  {}
bashInterceptor:
  enabled: true
bash:
  autoBackground:
    enabled: true
retry:
  maxRetries: 2
  fallbackChains:
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - xai/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
modelRoles:
  default: openai-codex/gpt-6-sol:medium
  smol: openai-codex/gpt-6-luna:high
  vision: openai-codex/gpt-6-luna:high
  advisor: anthropic/claude-fable-5:high
  web: web/exa
tier:
  openai: auto
dev:
  autoqaConsent: granted
composer:
  shape: pi
skills:
  enableClaudeUser: false
  enableClaudeProject: false
  ignoredSkills:
    - "*superpower*"
    - subagent-driven-development
    - brainstorming
    - writing-plans
compaction:
  thresholdTokens: 256000
extendedContext: false
display:
  showTurnTime: true
  cacheMissMarker: true
plan:
  enabled: false
commands:
  enableClaudeProject: false
edit:
  mode: apply_patch